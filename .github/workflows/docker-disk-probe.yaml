# Measures, per image, how much disk a build costs and whether it succeeds.
#
# One job per image, which is deliberate. GitHub guarantees only 14GB of free
# space, so the number that matters is the peak a single image reaches on its
# own runner, not the total a sequential run accumulates. It also bounds the
# blast radius: a lost runner costs one image rather than the whole sweep.
#
# Never pushes, and never runs automatically on master.

name: Docker image disk probe

on:
    workflow_dispatch:
        inputs:
            runner:
                description: "Runner to probe"
                type: choice
                default: "ubuntu-latest"
                options:
                    - "ubuntu-latest"
                    - "ubuntu-24.04-arm"
                    - "namespace-profile-4x16"
                    - "namespace-profile-16x32"
            filter:
                description: "Only probe images whose path matches this (e.g. stage-2)"
                default: ""
    push:
        branches:
            - "dcj/docker-disk-probe"

jobs:
    enumerate:
        name: Enumerate images
        runs-on: ubuntu-latest
        outputs:
            images: ${{ steps.list.outputs.images }}
        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
            - name: List images in build-all order
              id: list
              env:
                  FILTER: ${{ inputs.filter || '' }}
              run: |
                  set -euo pipefail
                  mapfile -t dirs < <(
                      find integrations/docker/images -name Dockerfile ! -path "*chip-cert-bins/*" \
                          | sort | xargs -n1 dirname
                  )
                  json="[]"
                  for d in "${dirs[@]}"; do
                      [[ -n $FILTER && $d != *"$FILTER"* ]] && continue
                      json=$(jq -c --arg n "${d##*/}" --arg p "$d" '. + [{name:$n, path:$p}]' <<<"$json")
                  done
                  echo "images=$json" >>"$GITHUB_OUTPUT"
                  jq -r '.[] | "  " + .path' <<<"$json"
                  echo "count: $(jq length <<<"$json")"

    probe:
        name: ${{ matrix.image.name }}
        needs: enumerate
        runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
        timeout-minutes: 120
        strategy:
            fail-fast: false
            max-parallel: 6
            matrix:
                image: ${{ fromJSON(needs.enumerate.outputs.images) }}
        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            - name: Build and measure
              env:
                  IMAGE_PATH: ${{ matrix.image.path }}
                  IMAGE_NAME: ${{ matrix.image.name }}
              run: |
                  set -uo pipefail
                  # GitHub runs steps under `bash -e`; a failing build must be
                  # recorded rather than aborting before the disk figures are read.
                  set +e

                  DOCKER_ROOT="$(docker info --format '{{.DockerRootDir}}')"
                  avail() { df -BM --output=avail "$DOCKER_ROOT" | tail -1 | tr -dc '0-9'; }
                  used() { df -BM --output=used "$DOCKER_ROOT" | tail -1 | tr -dc '0-9'; }

                  start_avail=$(avail)
                  start_used=$(used)
                  echo "runner=${{ inputs.runner || 'ubuntu-latest' }} arch=$(uname -m) free=${start_avail}MB"

                  t0=$SECONDS
                  (cd "$IMAGE_PATH" && ./build.sh) 2>&1 | tail -400
                  rc=${PIPESTATUS[0]}
                  elapsed=$((SECONDS - t0))

                  end_avail=$(avail)
                  peak=$(( $(used) - start_used ))

                  status=ok
                  if [[ $rc -ne 0 ]]; then
                      status=fail
                      # Distinguish running out of room from an ordinary build break.
                      if [[ $end_avail -lt 1024 ]]; then status=DISK; fi
                  fi

                  {
                      echo "### \`$IMAGE_NAME\`"
                      echo
                      echo "| metric | value |"
                      echo "|---|---|"
                      echo "| status | **$status** (rc=$rc) |"
                      echo "| disk added | ${peak} MB |"
                      echo "| free at start | ${start_avail} MB |"
                      echo "| free at end | ${end_avail} MB |"
                      echo "| peak vs 14GB guarantee | $(( peak * 100 / 14336 ))% |"
                      echo "| build time | ${elapsed}s |"
                  } >>"$GITHUB_STEP_SUMMARY"

                  echo "RESULT $IMAGE_NAME $status ${peak}MB ${elapsed}s"
                  exit $rc
